name: Publicar Santa Luzia Windows Beta

on:
  push:
    branches: [main]
    paths-ignore:
      - "releases/**"
      - "notes/**"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santa-luzia-windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      AUTH_SECRET: ci-windows-beta-santa-luzia-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - name: Checkout canal Beta Windows
        uses: actions/checkout@v4
        with:
          path: beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Obter base estável do Android code 18
        shell: pwsh
        run: |
          $beta = Get-Content beta/config/windows-beta.json | ConvertFrom-Json
          git clone https://github.com/lucasssfelipeee26-hash/comunidade-santa-luzia.git app
          Push-Location app
          git checkout $beta.androidBaseCommit
          Pop-Location

      - name: Aplicar arquivos exclusivos da Beta Windows
        shell: pwsh
        run: |
          robocopy beta app /E /XD .git .github /XF README.md
          $copyExit = $LASTEXITCODE
          if ($copyExit -gt 7) { throw "Falha ao aplicar overlay da Beta Windows: $copyExit" }
          $global:LASTEXITCODE = 0
          $beta = Get-Content app/config/windows-beta.json | ConvertFrom-Json
          if ($beta.updateRepository -ne $env:GITHUB_REPOSITORY) {
            throw "Repositório de atualização incorreto: $($beta.updateRepository)"
          }
          exit 0

      - name: Validar pacote nativo consolidado Windows
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload-v5.cjs
          node --check electron/behavior-fixes.js
          $main = Get-Content electron/main.cjs -Raw
          $preload = Get-Content electron/preload-v5.cjs -Raw
          $behavior = Get-Content electron/behavior-fixes.js -Raw
          $motionCss = Get-Content electron/motion-fixes.css -Raw
          foreach ($marker in @("preload-v5.cjs", "behavior-fixes.js", "motion-fixes.css")) {
            if (-not $main.Contains($marker)) { throw "Integração nativa incompleta: $marker não está ligada pelo Electron." }
          }
          foreach ($marker in @(
            "sl-trophy-3d",
            "sl-avatar-spin",
            "sl-ranking-banner",
            "sl-logo-entry",
            "sl-page-enter",
            "sl-video-card-",
            "Comitê de Presença",
            "Central de Formação",
            "sl-bottom-active",
            "HIDDEN_MODERATOR_SHORTCUTS",
            "Entrou no Top 3",
            "passou você",
            "windowsMotionVersion"
          )) {
            if (-not $preload.Contains($marker)) { throw "Correção visual do vídeo incompleta: marcador $marker ausente." }
          }
          foreach ($marker in @("PRESENCE_KEY", "sl-task-fullscreen", "Conferir resultado", "NAV_TIMEOUT", "Presença diária")) {
            if (-not $behavior.Contains($marker)) { throw "Correção comportamental do vídeo incompleta: marcador $marker ausente." }
          }
          foreach ($marker in @("slHeaderMenuEnter", "slTabPanelEnter", ".app-nav-tile")) {
            if (-not $motionCss.Contains($marker)) { throw "Correção CSS complementar incompleta: marcador $marker ausente." }
          }

      - name: Instalar dependências
        working-directory: app
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        working-directory: app
        shell: pwsh
        run: npx tsc --noEmit

      - name: Auditar robustez
        working-directory: app
        shell: pwsh
        run: npm run audit:robustez

      - name: Gerar build web
        working-directory: app
        shell: pwsh
        run: npm run build

      - name: Gerar Setup e Portable Windows
        working-directory: app
        shell: pwsh
        run: npm run windows:beta:dist

      - name: Validar artefatos, beta.yml e versão
        shell: pwsh
        run: |
          $beta = Get-Content app/config/windows-beta.json | ConvertFrom-Json
          $setup = Get-ChildItem app/dist-windows -Filter "Santa-Luzia-Beta-Setup-$($beta.versionName)-x64.exe" | Select-Object -First 1
          $portable = Get-ChildItem app/dist-windows -Filter "Santa-Luzia-Beta-Portable-$($beta.versionName)-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE não foi gerado." }
          if (-not $portable) { throw "Portable EXE não foi gerado." }
          if ($setup.Length -lt 20MB) { throw "Setup EXE é menor que o esperado." }
          if ($portable.Length -lt 20MB) { throw "Portable EXE é menor que o esperado." }
          $betaYml = Join-Path (Resolve-Path app/dist-windows) "beta.yml"
          if (-not (Test-Path $betaYml)) { throw "beta.yml não foi gerado; auto-update Beta seria quebrado." }
          $betaYmlText = Get-Content $betaYml -Raw
          if (-not $betaYmlText.Contains("version: $($beta.versionName)")) { throw "beta.yml não aponta para $($beta.versionName)." }
          if (-not $betaYmlText.Contains($setup.Name)) { throw "beta.yml não referencia o Setup correto." }
          $setupSha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $portableSha = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()
          "WINDOWS_BETA_VERSION=$($beta.versionName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE=$($portable.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP_SIZE=$($setup.Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE_SIZE=$($portable.Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP_SHA=$setupSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE_SHA=$portableSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Testar o Setup em Windows real
        shell: pwsh
        run: |
          $setup = Get-Item $env:WINDOWS_BETA_SETUP
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Setup abriu, mas terminou com código $($process.ExitCode)." }
          Start-Sleep -Seconds 3
          $programRoot = Join-Path $env:LOCALAPPDATA "Programs"
          $installed = Get-ChildItem $programRoot -Recurse -Filter "Santa Luzia Beta.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Setup terminou, mas o executável instalado não foi encontrado em $programRoot." }
          Write-Host "Setup testado com sucesso: $($installed.FullName)"
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Guardar artefatos para validação
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-windows-beta-${{ env.WINDOWS_BETA_VERSION }}
          path: |
            app/dist-windows/*.exe
            app/dist-windows/*.blockmap
            app/dist-windows/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publicar prerelease Windows no GitHub
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-beta-v$env:WINDOWS_BETA_VERSION"
          $notes = @"
          Santa Luzia Beta para Windows — $env:WINDOWS_BETA_VERSION

          Mantém todas as correções da Beta anterior e refaz o instalador Windows.

          O Setup desta versão foi simplificado para instalação por usuário em um clique,
          sem exigir administrador, com atalhos do Windows e canal beta do GitHub preservado.
          O próprio workflow instala o Setup silenciosamente em um Windows real antes de publicar.

          O Android estável 1.0.6/code18 permanece sem estas alterações.
          "@
          $notesPath = "$env:RUNNER_TEMP\windows-beta-notes.md"
          $notes | Set-Content -Path $notesPath -Encoding utf8
          $assets = Get-ChildItem app/dist-windows -File | Where-Object { $_.Extension -in '.exe','.blockmap','.yml' } | ForEach-Object { $_.FullName }
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          }

      - name: Registrar recibo da publicação
        if: github.ref == 'refs/heads/main'
        working-directory: beta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $receipt = [ordered]@{
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            versionName = $env:WINDOWS_BETA_VERSION
            repository = $env:GITHUB_REPOSITORY
            setup = [ordered]@{ file = (Split-Path $env:WINDOWS_BETA_SETUP -Leaf); size = [int64]$env:WINDOWS_BETA_SETUP_SIZE; sha256 = $env:WINDOWS_BETA_SETUP_SHA }
            portable = [ordered]@{ file = (Split-Path $env:WINDOWS_BETA_PORTABLE -Leaf); size = [int64]$env:WINDOWS_BETA_PORTABLE_SIZE; sha256 = $env:WINDOWS_BETA_PORTABLE_SHA }
            androidChannel = 'lucasssfelipeee26-hash/comunidade-santa-luzia — 1.0.6/code18'
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content releases/windows-beta-latest.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- releases/windows-beta-latest.json
          git commit -m "Registra Windows Beta $env:WINDOWS_BETA_VERSION" || exit 0
          git push origin HEAD:main