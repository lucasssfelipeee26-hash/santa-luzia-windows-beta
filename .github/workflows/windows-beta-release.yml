name: Publicar Santa Luzia Windows Beta

on:
  push:
    branches: [main]
    paths-ignore:
      - "releases/**"
      - "runtime/**"
      - "notes/**"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santa-luzia-windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      AUTH_SECRET: ci-windows-beta-santa-luzia-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - name: Checkout canal Beta Windows
        uses: actions/checkout@v4
        with:
          path: beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Obter base estável do Android code 18
        shell: pwsh
        run: |
          $beta = Get-Content beta/config/windows-beta.json | ConvertFrom-Json
          git clone https://github.com/lucasssfelipeee26-hash/comunidade-santa-luzia.git app
          Push-Location app
          git checkout $beta.androidBaseCommit
          Pop-Location

      - name: Aplicar arquivos exclusivos da Beta Windows
        shell: pwsh
        run: |
          robocopy beta app /E /XD .git .github /XF README.md
          $copyExit = $LASTEXITCODE
          if ($copyExit -gt 7) { throw "Falha ao aplicar overlay da Beta Windows: $copyExit" }
          $global:LASTEXITCODE = 0
          $beta = Get-Content app/config/windows-beta.json | ConvertFrom-Json
          if ($beta.updateRepository -ne $env:GITHUB_REPOSITORY) {
            throw "Repositório de atualização incorreto: $($beta.updateRepository)"
          }
          exit 0

      - name: Validar pacote nativo consolidado Windows
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/manifest-updater.cjs
          node --check electron/remote-runtime-updater.cjs
          node --check electron/preload-v5.cjs
          node --check electron/behavior-fixes.js
          $main = Get-Content electron/main.cjs -Raw
          $preload = Get-Content electron/preload-v5.cjs -Raw
          $behavior = Get-Content electron/behavior-fixes.js -Raw
          $motionCss = Get-Content electron/motion-fixes.css -Raw
          foreach ($marker in @("preload-v5.cjs", "behavior-fixes.js", "motion-fixes.css")) {
            if (-not $main.Contains($marker)) { throw "Integração nativa incompleta: $marker não está ligada pelo Electron." }
          }
          foreach ($marker in @(
            "sl-trophy-3d",
            "sl-avatar-spin",
            "sl-ranking-banner",
            "sl-logo-entry",
            "sl-page-enter",
            "sl-video-card-",
            "Comitê de Presença",
            "Central de Formação",
            "sl-bottom-active",
            "HIDDEN_MODERATOR_SHORTCUTS",
            "Entrou no Top 3",
            "passou você",
            "windowsMotionVersion"
          )) {
            if (-not $preload.Contains($marker)) { throw "Correção visual do vídeo incompleta: marcador $marker ausente." }
          }
          foreach ($marker in @("PRESENCE_KEY", "sl-task-fullscreen", "Conferir resultado", "NAV_TIMEOUT", "Presença diária")) {
            if (-not $behavior.Contains($marker)) { throw "Correção comportamental do vídeo incompleta: marcador $marker ausente." }
          }
          foreach ($marker in @("slHeaderMenuEnter", "slTabPanelEnter", ".app-nav-tile")) {
            if (-not $motionCss.Contains($marker)) { throw "Correção CSS complementar incompleta: marcador $marker ausente." }
          }
          foreach ($marker in @("aplicarRuntimeWindowsEmpacotado", "remoteRuntimeForcePending", "did-finish-load")) {
            if (-not $main.Contains($marker)) { throw "Correção definitiva do runtime remoto ausente: $marker" }
          }
          if (-not (Test-Path runtime/windows-beta-runtime.js)) { throw "Runtime consolidado não foi empacotado." }
          $runtime = Get-Content runtime/windows-beta-runtime.js -Raw
          foreach ($marker in @("enhancePresenceCenter", "ensureEarlyJustification", "organizePublishedScale", "enrichPublishedScaleLiturgy", "organizeFormationManagement", "enhanceDelayClocks", "enhanceProfileAndSoundControls", "enhanceAnimatedNavigationIcons", "enhanceProfileIconAndInstalledState", "removeRedundantCopy", "enhancePersonalThemePicker", "expireTransientNotifications")) {
            if (-not $runtime.Contains($marker)) { throw "Recurso solicitado ausente do runtime Windows: $marker" }
          }
          $whatajong = Get-Content app/api/jogo/whatajong/resultado/route.ts -Raw
          foreach ($marker in @("salvarRankingAjuste", "pontosAcumuladosPorRodada", "notificarMudancasRanking")) {
            if (-not $whatajong.Contains($marker)) { throw "Whatajong sem integração completa com o ranking: $marker" }
          }
          $polish = Get-Content electron/beta7-polish.js -Raw
          foreach ($marker in @("restoreAndroidBottomNav", "sl-b9-private-presence", "allowedPresenceUser", "PRESENCE_KEY_PREFIX")) {
            if (-not $polish.Contains($marker)) { throw "Correção visual e privada da Beta 9 incompleta: $marker ausente." }
          }
          if ($polish.Contains('id="b7Medal"') -or $polish.Contains('M46 27.4l2.2 4.5')) { throw "A estrela central ainda está presente no troféu." }

      - name: Testar fallback pelo manifesto do GitHub
        working-directory: app
        shell: pwsh
        run: npm run test:manifest-updater

      - name: Testar correções visuais e privacidade da Beta Windows
        working-directory: app
        shell: pwsh
        run: npm run test:windows-polish

      - name: Testar canal remoto exclusivo do Windows
        working-directory: app
        shell: pwsh
        run: |
          npm run test:remote-runtime
          node --check runtime/windows-beta-runtime.js
          $manifest = Get-Content releases/windows-beta-runtime.json | ConvertFrom-Json
          $script = Get-Item $manifest.script.path
          $sha = (Get-FileHash $script.FullName -Algorithm SHA256).Hash.ToLower()
          if ($script.Length -ne [int64]$manifest.script.size) { throw "Tamanho do runtime remoto diverge do manifesto." }
          if ($sha -ne $manifest.script.sha256) { throw "SHA-256 do runtime remoto diverge do manifesto." }
          if ($manifest.repository -ne $env:GITHUB_REPOSITORY) { throw "Runtime remoto aponta para outro repositório." }

      - name: Instalar dependências
        working-directory: app
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        working-directory: app
        shell: pwsh
        run: npx tsc --noEmit

      - name: Auditar robustez
        working-directory: app
        shell: pwsh
        run: npm run audit:robustez

      - name: Gerar build web
        working-directory: app
        shell: pwsh
        run: npm run build

      - name: Gerar Setup e Portable Windows
        working-directory: app
        shell: pwsh
        run: npm run windows:beta:dist

      - name: Validar artefatos, beta.yml e versão
        shell: pwsh
        run: |
          $beta = Get-Content app/config/windows-beta.json | ConvertFrom-Json
          $setup = Get-ChildItem app/dist-windows -Filter "Santa-Luzia-Beta-Setup-$($beta.versionName)-x64.exe" | Select-Object -First 1
          $portable = Get-ChildItem app/dist-windows -Filter "Santa-Luzia-Beta-Portable-$($beta.versionName)-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE não foi gerado." }
          if (-not $portable) { throw "Portable EXE não foi gerado." }
          if ($setup.Length -lt 20MB) { throw "Setup EXE é menor que o esperado." }
          if ($portable.Length -lt 20MB) { throw "Portable EXE é menor que o esperado." }
          $betaYml = Join-Path (Resolve-Path app/dist-windows) "beta.yml"
          if (-not (Test-Path $betaYml)) { throw "beta.yml não foi gerado; auto-update Beta seria quebrado." }
          $betaYmlText = Get-Content $betaYml -Raw
          if (-not $betaYmlText.Contains("version: $($beta.versionName)")) { throw "beta.yml não aponta para $($beta.versionName)." }
          if (-not $betaYmlText.Contains($setup.Name)) { throw "beta.yml não referencia o Setup correto." }
          $manifestTests = Get-Content app/electron/manifest-updater.test.cjs -Raw
          foreach ($marker in @("compareVersions", "releaseSetupUrl", "validateSetup")) {
            if (-not $manifestTests.Contains($marker)) { throw "Cobertura do fallback incompleta: $marker não foi testado." }
          }
          $setupSha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $portableSha = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()
          "WINDOWS_BETA_VERSION=$($beta.versionName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE=$($portable.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP_SIZE=$($setup.Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE_SIZE=$($portable.Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SETUP_SHA=$setupSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_PORTABLE_SHA=$portableSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Testar o Setup em Windows real
        shell: pwsh
        run: |
          $setup = Get-Item $env:WINDOWS_BETA_SETUP
          Write-Host "Executando Setup real: $($setup.Name) ($($setup.Length) bytes)"
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Output "::error title=Setup retornou erro::O instalador real terminou com o código $($process.ExitCode)."
            "### Falha no Setup`nO instalador terminou com código $($process.ExitCode)." | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw "Setup abriu, mas terminou com código $($process.ExitCode)."
          }
          $programRoot = Join-Path $env:LOCALAPPDATA "Programs"
          $installed = $null
          for ($attempt = 1; $attempt -le 15 -and -not $installed; $attempt++) {
            Start-Sleep -Seconds 2
            $installed = Get-ChildItem $programRoot -Recurse -Filter "Santa Luzia Beta.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $installed) {
            $inventory = Get-ChildItem $programRoot -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            Write-Output "::error title=Executável instalado ausente::O Setup retornou sucesso, mas Santa Luzia Beta.exe não apareceu em $programRoot."
            "### Falha no Setup`nO instalador retornou sucesso, mas o executável não apareceu. Arquivos encontrados:`n$($inventory -join "`n")" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw "Setup terminou, mas o executável instalado não foi encontrado em $programRoot."
          }
          $appUpdateYml = Join-Path $installed.Directory.FullName "resources\app-update.yml"
          if (-not (Test-Path $appUpdateYml)) {
            Write-Output "::error title=Configuração do updater ausente::app-update.yml não foi instalado em $appUpdateYml."
            throw "Setup instalou o aplicativo, mas app-update.yml está ausente."
          }
          $appUpdateText = Get-Content $appUpdateYml -Raw
          foreach ($marker in @("provider: github", "repo: santa-luzia-windows-beta")) {
            if (-not $appUpdateText.Contains($marker)) {
              Write-Output "::error title=Configuração do updater inválida::app-update.yml não contém '$marker'. Conteúdo: $($appUpdateText -replace "`r?`n", "; ")"
              throw "app-update.yml instalado não contém: $marker"
            }
          }
          Write-Host "Setup testado com sucesso: $($installed.FullName)"
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Guardar artefatos para validação
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-windows-beta-${{ env.WINDOWS_BETA_VERSION }}
          path: |
            app/dist-windows/*.exe
            app/dist-windows/*.blockmap
            app/dist-windows/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publicar prerelease Windows no GitHub
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-beta-v$env:WINDOWS_BETA_VERSION"
          $notes = @"
          Santa Luzia Beta para Windows — $env:WINDOWS_BETA_VERSION

          Mantém todas as correções da Beta anterior e inaugura o canal remoto exclusivo do Windows.

          Depois desta instalação, ajustes de interface da Beta podem chegar diretamente pelo servidor,
          sem reinstalação. O Electron consulta um manifesto exclusivo, valida tamanho e SHA-256 do script
          e só então aplica a revisão. O Android e o servidor compartilhado permanecem intactos.
          O auto-update nativo duplo da Beta 8 também é mantido para mudanças do executável.
          O próprio workflow testa os mecanismos e instala o Setup em um Windows real antes de publicar.

          O Android estável 1.0.6/code18 permanece sem estas alterações.
          "@
          $notesPath = "$env:RUNNER_TEMP\windows-beta-notes.md"
          $notes | Set-Content -Path $notesPath -Encoding utf8
          $assets = Get-ChildItem app/dist-windows -File | Where-Object { $_.Extension -in '.exe','.blockmap','.yml' } | ForEach-Object { $_.FullName }
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file $notesPath --repo $env:GITHUB_REPOSITORY
          }

      - name: Registrar recibo da publicação
        if: github.ref == 'refs/heads/main'
        working-directory: beta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $receipt = [ordered]@{
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            versionName = $env:WINDOWS_BETA_VERSION
            repository = $env:GITHUB_REPOSITORY
            releaseTag = "windows-beta-v$env:WINDOWS_BETA_VERSION"
            setup = [ordered]@{
              file = (Split-Path $env:WINDOWS_BETA_SETUP -Leaf)
              size = [int64]$env:WINDOWS_BETA_SETUP_SIZE
              sha256 = $env:WINDOWS_BETA_SETUP_SHA
              downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/windows-beta-v$env:WINDOWS_BETA_VERSION/$(Split-Path $env:WINDOWS_BETA_SETUP -Leaf)"
            }
            portable = [ordered]@{ file = (Split-Path $env:WINDOWS_BETA_PORTABLE -Leaf); size = [int64]$env:WINDOWS_BETA_PORTABLE_SIZE; sha256 = $env:WINDOWS_BETA_PORTABLE_SHA }
            androidChannel = 'lucasssfelipeee26-hash/comunidade-santa-luzia — 1.0.6/code18'
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content releases/windows-beta-latest.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- releases/windows-beta-latest.json
          git commit -m "Registra Windows Beta $env:WINDOWS_BETA_VERSION" || exit 0
          git push origin HEAD:main
