name: Bootstrap Santa Luzia Windows Beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-windows-beta.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório Windows Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar base atual do Santa Luzia
        shell: bash
        run: |
          set -euo pipefail
          TMP_SOURCE="$RUNNER_TEMP/santa-luzia-source"
          git clone --depth 1 https://github.com/lucasssfelipeee26-hash/comunidade-santa-luzia.git "$TMP_SOURCE"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$TMP_SOURCE/" ./

          mkdir -p .github/workflows
          cp "$TMP_SOURCE/.github/workflows/windows-beta-release.yml" .github/workflows/windows-beta-release.yml

          # Não carregar para o canal Windows artefatos/recovery de assinatura Android.
          find .github -maxdepth 1 -type f \( -name '*signing*' -o -name '*code18*' -o -name 'motion*-result.json' \) -delete || true

          # Este workflow é temporário e some após a importação.
          rm -f .github/workflows/bootstrap-windows-beta.yml

      - name: Registrar repositório Windows independente
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github/temp-signing*' ':!.github/*code18*'
          if git diff --cached --quiet; then
            echo 'Nada para importar.'
            exit 0
          fi
          git commit -m 'Inicializa Santa Luzia Windows Beta separado do Android'
          git push origin HEAD:main
